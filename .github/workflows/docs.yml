name: Build and deploy Surls docs

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: surls-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/docs/requirements.txt
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Install documentation dependencies
        run: python -m pip install -r apps/docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict --clean --config-file apps/docs/mkdocs.yml
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.SURLS_CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.135.0 pages deploy apps/docs/site
          --project-name surls-docs
          --branch main
          --commit-hash "${GITHUB_SHA}"
