name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Free security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "26"
          cache: npm

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Scan Git history for secrets
        if: ${{ !cancelled() }}
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --verbose .

      - name: Scan source code
        if: ${{ !cancelled() }}
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep:1.172.0 \
            semgrep scan \
              --config p/typescript \
              --config p/javascript \
              --config p/nodejs \
              --error \
              --metrics=off \
              --exclude node_modules \
              --exclude .next \
              --exclude coverage \
              .

      - name: Scan dependencies and configuration
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.73.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          hide-progress: true
          skip-dirs: node_modules,.next,.git
          trivyignores: .trivyignore.yaml
