name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://surls:surls-ci-password@localhost:5432/surls?schema=public
  AUTH_SECRET: ci-8Vx2pK7mQ4rT9nL6yB3sW0zF5hD1aC
  BASE_URL: http://localhost:3000
  WEBAUTHN_RP_ID: localhost
  WEBAUTHN_ORIGIN: http://localhost:3000

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: surls
          POSTGRES_PASSWORD: surls-ci-password
          POSTGRES_DB: surls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surls -d surls"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: verify
    env:
      POSTGRES_USER: surls
      POSTGRES_PASSWORD: surls-ci-password
      POSTGRES_DB: surls
      SURLS_IMAGE: surls:ci
      SURLS_PORT: "3000"
      SURLS_PUBLIC_WEBROOT_PATH: ./www
      AUTH_SECRET: ci-8Vx2pK7mQ4rT9nL6yB3sW0zF5hD1aC
      BASE_URL: http://localhost:3000
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:3000
      INITIAL_ADMIN_EMAIL: admin@example.test
      INITIAL_ADMIN_PASSWORD: ci-admin-password-12345
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build smoke image
        run: |
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          docker build \
            --build-arg SURLS_GIT_SHA="${GITHUB_SHA}" \
            --build-arg NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}" \
            -t surls:ci .

      - name: Create public webroot mount
        run: mkdir -p www

      - name: Start smoke stack
        run: docker compose up -d --no-build

      - name: Wait for Surls
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://localhost:3000/api/health/ready; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Stop smoke stack
        if: always()
        run: docker compose down -v

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/surls
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SURLS_GIT_SHA=${{ github.sha }}
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
