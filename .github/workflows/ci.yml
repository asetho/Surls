name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://surls:surls-ci-password@localhost:5432/surls?schema=public
  AUTH_SECRET: surls-ci-${{ github.run_id }}-${{ github.run_attempt }}-4f9Qp2nK7vX3
  BASE_URL: http://localhost:3000
  WEBAUTHN_RP_ID: localhost
  WEBAUTHN_ORIGIN: http://localhost:3000

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: surls
          POSTGRES_PASSWORD: surls-ci-password
          POSTGRES_DB: surls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surls -d surls"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    env:
      POSTGRES_USER: surls
      POSTGRES_PASSWORD: surls-ci-password
      POSTGRES_DB: surls
      SURLS_IMAGE: surls:ci
      SURLS_PORT: "3000"
      SURLS_PUBLIC_WEBROOT_PATH: ./www
      SURLS_UPLOADS_PATH: ./uploads
      AUTH_SECRET: surls-ci-${{ github.run_id }}-${{ github.run_attempt }}-4f9Qp2nK7vX3
      BASE_URL: http://localhost:3000
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:3000
      INITIAL_ADMIN_EMAIL: admin@example.test
      INITIAL_ADMIN_PASSWORD: ci-admin-password-12345
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build smoke image
        run: |
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}" >> "$GITHUB_ENV"
          docker build \
            --build-arg SURLS_GIT_SHA="${GITHUB_SHA}" \
            --secret id=next_server_actions_encryption_key,env=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY \
            -t surls:ci .

      - name: Create host mounts
        run: |
          mkdir -p www uploads
          chmod 0777 uploads

      - name: Start smoke stack
        run: docker compose up -d --no-build

      - name: Wait for Surls
        run: |
          for _ in {1..40}; do
            if curl -fsS http://localhost:3000/api/health/ready; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Stop smoke stack
        if: always()
        run: docker compose down -v

  release:
    name: Version and publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: surls-auto-version
      cancel-in-progress: false
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
          cache: npm

      - name: Bump patch version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTOR_NAME: github-actions[bot]
          RELEASE_ACTOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          event_sha="${GITHUB_SHA}"
          current_version="$(node -p "require('./package.json').version")"
          current_tag="v${current_version}"
          [[ "${current_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          recovery_version="$(node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); process.stdout.write([major, minor, patch + 1].join('.'))" "${current_version}")"
          recovery_tag="v${recovery_version}"
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w 0)"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --force origin main --tags
          origin_main="$(git rev-parse refs/remotes/origin/main)"
          publish_mutable=false

          if git tag --points-at "${event_sha}" | grep -Fxq "${current_tag}"; then
            release_version="${current_version}"
            [[ "${event_sha}" == "${origin_main}" ]] && publish_mutable=true
            git checkout --detach "${event_sha}"
          elif tagged_sha="$(git rev-list -n 1 "${recovery_tag}" 2>/dev/null)" && [[ -n "${tagged_sha}" ]]; then
            release_parent="$(git rev-parse "${tagged_sha}^")"
            release_subject="$(git log -1 --format=%s "${tagged_sha}")"
            tagged_version="$(git show "${tagged_sha}:package.json" | node -e "let json = ''; process.stdin.on('data', chunk => json += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(json).version));")"

            if [[ "${release_parent}" != "${event_sha}" || "${release_subject}" != "Release ${recovery_tag} [skip ci]" || "${tagged_version}" != "${recovery_version}" ]]; then
              echo "${recovery_tag} does not identify the release commit for ${event_sha}" >&2
              exit 1
            fi

            release_version="${recovery_version}"
            [[ "${tagged_sha}" == "${origin_main}" ]] && publish_mutable=true
            git checkout --detach "${tagged_sha}"
          elif [[ "${origin_main}" != "${event_sha}" ]]; then
            echo "main advanced beyond this workflow's revision before it created ${recovery_tag}" >&2
            exit 1
          else
            git config user.name "${RELEASE_ACTOR_NAME}"
            git config user.email "${RELEASE_ACTOR_EMAIL}"
            npm version patch -m "Release v%s [skip ci]"
            release_version="$(node -p "require('./package.json').version")"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" push --atomic origin HEAD:main "refs/tags/v${release_version}"
            publish_mutable=true
          fi

          [[ "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_sha="$(git rev-parse HEAD)"
          major_minor="$(node -e "const [major, minor] = process.argv[1].split('.'); process.stdout.write(major + '.' + minor)" "${release_version}")"

          {
            echo "version=${release_version}"
            echo "major_minor=${major_minor}"
            echo "publish_mutable=${publish_mutable}"
            echo "tag=v${release_version}"
            echo "sha=${release_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/surls
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.publish_mutable == 'true' }}
            type=raw,value=main,enable=${{ steps.version.outputs.publish_mutable == 'true' }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.publish_mutable == 'true' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SURLS_GIT_SHA=${{ steps.version.outputs.sha }}
          secrets: |
            next_server_actions_encryption_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            --target "${RELEASE_SHA}" \
            --title "Surls ${RELEASE_TAG}" \
            --generate-notes
