services:
  db:
    container_name: "${SURLS_DB_CONTAINER_NAME:-surls-db}"
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-surls}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-surls}"
    volumes:
      - surls-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surls} -d ${POSTGRES_DB:-surls}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: "${SURLS_APP_CONTAINER_NAME:-surls-app}"
    image: ${SURLS_IMAGE:-ghcr.io/asetho/surls:latest}
    build:
      context: .
      args:
        SURLS_GIT_SHA: "${SURLS_GIT_SHA:-}"
      secrets:
        - next_server_actions_encryption_key
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-surls}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-surls}?schema=public"
      BASE_URL: "${BASE_URL:-http://localhost:3000}"
      SURLS_LOGIN_DEV_ENABLED: "${SURLS_LOGIN_DEV_ENABLED:-false}"
      APP_NAME: "${APP_NAME:-Surls}"
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in .env}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_PROVIDER_NAME: "${OIDC_PROVIDER_NAME:-Single sign-on}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:-}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:-}"
      MICROSOFT_TENANT_ID: "${MICROSOFT_TENANT_ID:-}"
      FACEBOOK_CLIENT_ID: "${FACEBOOK_CLIENT_ID:-}"
      FACEBOOK_CLIENT_SECRET: "${FACEBOOK_CLIENT_SECRET:-}"
      X_CLIENT_ID: "${X_CLIENT_ID:-}"
      X_CLIENT_SECRET: "${X_CLIENT_SECRET:-}"
      SESSION_DAYS: "${SESSION_DAYS:-14}"
      API_TOKEN_DAYS: "${API_TOKEN_DAYS:-90}"
      CLICK_EVENT_RETENTION_DAYS: "${CLICK_EVENT_RETENTION_DAYS:-365}"
      AUDIT_LOG_RETENTION_DAYS: "${AUDIT_LOG_RETENTION_DAYS:-365}"
      ALLOW_PRIVATE_DESTINATIONS: "${ALLOW_PRIVATE_DESTINATIONS:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      CUSTOM_PAGES_DIR: "/app/www"
      PUBLIC_WEBROOT_DIR: "/app/www"
      UPLOADS_DIR: "/app/uploads"
      UPLOAD_MAX_BYTES: "${UPLOAD_MAX_BYTES:-26214400}"
      UPLOAD_USER_STORAGE_QUOTA_BYTES: "${UPLOAD_USER_STORAGE_QUOTA_BYTES:-1073741824}"
      UPLOAD_SITE_STORAGE_QUOTA_BYTES: "${UPLOAD_SITE_STORAGE_QUOTA_BYTES:-10737418240}"
      WEBAUTHN_RP_ID: "${WEBAUTHN_RP_ID:-localhost}"
      WEBAUTHN_ORIGIN: "${WEBAUTHN_ORIGIN:-http://localhost:3000}"
      INITIAL_ADMIN_EMAIL: "${INITIAL_ADMIN_EMAIL:-}"
      INITIAL_ADMIN_NAME: "${INITIAL_ADMIN_NAME:-Surls Admin}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:-}"
      SURLS_GIT_SHA: "${SURLS_GIT_SHA:-}"
      NEXT_PUBLIC_GIT_SHA: "${SURLS_GIT_SHA:-}"
      SURLS_RUN_MIGRATIONS: "${SURLS_RUN_MIGRATIONS:-true}"
      SURLS_RUN_BOOTSTRAP: "${SURLS_RUN_BOOTSTRAP:-true}"
    ports:
      - "${SURLS_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: "${SURLS_PUBLIC_WEBROOT_PATH:?Set SURLS_PUBLIC_WEBROOT_PATH to an existing host directory for the public webroot}"
        target: /app/www
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${SURLS_UPLOADS_PATH:?Set SURLS_UPLOADS_PATH to an existing host directory for uploaded files}"
        target: /app/uploads
        bind:
          create_host_path: false
    secrets:
      - next_server_actions_encryption_key
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
      org.opencontainers.image.title: "Surls"
      org.opencontainers.image.description: "Personal short URL system"

volumes:
  surls-postgres:

secrets:
  next_server_actions_encryption_key:
    environment: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
